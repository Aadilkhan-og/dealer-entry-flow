workflows:
  android-apk:
    name: Android APK Build
    max_build_duration: 60
    environment:
      node: 22.22.3
      vars:
        EXPO_PUBLIC_SUPABASE_URL: https://thvvtjdxentcnmuutxeu.supabase.co
        EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRodnZ0amR4ZW50Y25tdXV0eGV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3NTYyMzIsImV4cCI6MjA5NDMzMjIzMn0.jXSGUXHldUrrk-n5UvcXlaKnFfXdNPCoajpke60df2A
        EXPO_PUBLIC_OCR_SPACE_API_KEY: K84930280788957
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
          # Install react-compiler-runtime matching the version babel-preset-expo pulled in
          COMPILER_VER=$(node -e "try{process.stdout.write(require('babel-plugin-react-compiler/package.json').version)}catch(e){}" 2>/dev/null)
          if [ -n "$COMPILER_VER" ]; then
            echo "Installing react-compiler-runtime@$COMPILER_VER"
            npm install "react-compiler-runtime@$COMPILER_VER" --legacy-peer-deps --no-save
          fi

          # react-native-worklets JSC fix for RN 0.81+: jsctooling target may be absent.
          WORKLETS_CMAKE="node_modules/react-native-worklets/android/CMakeLists.txt"
          if [ -f "$WORKLETS_CMAKE" ]; then
            cat > /tmp/patch-worklets-cmake.cjs <<'NODE'
            const fs = require("fs");
            const path = process.argv[2];
            const source = fs.readFileSync(path, "utf8");
            const pattern = /elseif\(\$\{JS_RUNTIME\} STREQUAL "jsc"\)\n\s*if\(ReactAndroid_VERSION_MINOR GREATER_EQUAL 76\)\n\s*target_link_libraries\(worklets ReactAndroid::jsctooling\)\n\s*else\(\)\n\s*target_link_libraries\(worklets ReactAndroid::jscexecutor\)\n\s*endif\(\)\nendif\(\)/m;
            const replacement = `elseif(\${JS_RUNTIME} STREQUAL "jsc")\n  if(ReactAndroid_VERSION_MINOR GREATER_EQUAL 76)\n    if(TARGET ReactAndroid::jsctooling)\n      target_link_libraries(worklets ReactAndroid::jsctooling)\n    elseif(TARGET ReactAndroid::jscexecutor)\n      target_link_libraries(worklets ReactAndroid::jscexecutor)\n    else()\n      message(WARNING "worklets: missing ReactAndroid::jsctooling/jscexecutor for JSC; continuing without extra JSC tooling target")\n    endif()\n  else()\n    target_link_libraries(worklets ReactAndroid::jscexecutor)\n  endif()\nendif()`;
            if (!pattern.test(source)) {
              console.log("react-native-worklets CMake patch not needed or pattern not found");
              process.exit(0);
            }
            fs.writeFileSync(path, source.replace(pattern, replacement));
            console.log("Applied react-native-worklets JSC CMake compatibility patch");
            NODE
            node /tmp/patch-worklets-cmake.cjs "$WORKLETS_CMAKE"
          fi
      - name: Write .env file
        script: |
          cat > .env << EOF
          EXPO_PUBLIC_SUPABASE_URL=$EXPO_PUBLIC_SUPABASE_URL
          EXPO_PUBLIC_SUPABASE_ANON_KEY=$EXPO_PUBLIC_SUPABASE_ANON_KEY
          EXPO_PUBLIC_OCR_SPACE_API_KEY=$EXPO_PUBLIC_OCR_SPACE_API_KEY
          EOF
      - name: Build APK
        script: |
          npx expo prebuild --platform android --clean
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

          # Force JSC and disable Hermes to avoid Hermes parse failures from dynamic import output.
          if [ -f android/gradle.properties ]; then
            sed -i 's/^expo\.jsEngine=.*/expo.jsEngine=jsc/g' android/gradle.properties
            sed -i 's/^hermesEnabled=.*/hermesEnabled=false/g' android/gradle.properties
            grep -q '^expo\.jsEngine=' android/gradle.properties || echo 'expo.jsEngine=jsc' >> android/gradle.properties
            grep -q '^hermesEnabled=' android/gradle.properties || echo 'hermesEnabled=false' >> android/gradle.properties

            echo "Configured Android JS engine flags:"
            grep -E '^(expo\.jsEngine|hermesEnabled)=' android/gradle.properties || true
          fi

          # Patch build tools version to use pre-installed 34.0.0 instead of 35
          sed -i 's/buildToolsVersion = "35.0.0"/buildToolsVersion = "34.0.0"/g' android/build.gradle
          sed -i 's/buildToolsVersion = "35"/buildToolsVersion = "34.0.0"/g' android/build.gradle

          # Generate a release keystore for signing
          keytool -genkey -v \
            -keystore android/app/release.keystore \
            -alias dealer-flow \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=DealerFlow,OU=Mobile,O=DealerFlow,L=Unknown,S=Unknown,C=IN" \
            -storepass dealer123 -keypass dealer123

          cd android
          ./gradlew assembleRelease \
            -Pexpo.jsEngine=jsc \
            -PhermesEnabled=false \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
            -Pandroid.injected.signing.store.password=dealer123 \
            -Pandroid.injected.signing.key.alias=dealer-flow \
            -Pandroid.injected.signing.key.password=dealer123
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
    publishing:
      email:
        recipients:
          - aadilmalik96672@gmail.com
